# Nginx in front of the API gateway: reverse proxy and load balancer (HRD-1, HRD-12).
# Docker DNS returns every gateway copy for the name "api-gateway"; Nginx resolves it
# when it starts, so restart Nginx after changing the number of gateway copies:
#   docker compose up -d --scale api-gateway=3 && docker compose restart nginx

upstream api_gateway {
    # Round robin (the default): each request goes to the next copy, so refreshing the page
    # visibly alternates between copies. For busy production traffic, add "least_conn;" here.
    server api-gateway:3000 max_fails=2 fail_timeout=10s;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    gzip on;
    gzip_types application/json text/plain text/css application/javascript;

    location / {
        proxy_pass http://api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If one gateway copy fails, retry the request on another one
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
    }
}

# HTTPS (needs a domain name pointing at this server). After running Certbot, or once
# certificates are in place, replace the server block above with:
