name: english-online-learning-platform

# Secrets (JWT secret and Atlas connection strings) come from the root .env file.
# See .env.example for the variable names.

services:
  registration-service:
    build: ./registration-service
    restart: unless-stopped
    environment:
      PORT: 3001
      MONGO_URI: ${MONGO_URI_USERS:?Set MONGO_URI_USERS in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  login-service:
    build: ./login-service
    restart: unless-stopped
    environment:
      PORT: 3002
      # Same database as registration: login reads the users collection it writes
      MONGO_URI: ${MONGO_URI_USERS:?Set MONGO_URI_USERS in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  content-service:
    build: ./content-service
    restart: unless-stopped
    environment:
      PORT: 3003
      MONGO_URI: ${MONGO_URI_CONTENT:?Set MONGO_URI_CONTENT in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      LEARNING_SERVICE_URL: http://learning-service:3004
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  learning-service:
    build: ./learning-service
    restart: unless-stopped
    environment:
      PORT: 3004
      MONGO_URI: ${MONGO_URI_LEARNING:?Set MONGO_URI_LEARNING in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      CONTENT_SERVICE_URL: http://content-service:3003
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    # Not published to the host: Nginx is the public entry point and balances these copies.
    # Scale with: docker compose up -d --scale api-gateway=3 && docker compose restart nginx
    expose:
      - "3000"
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      PORT: 3000
      TRUST_PROXY: 1
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      REGISTRATION_SERVICE_URL: http://registration-service:3001
      LOGIN_SERVICE_URL: http://login-service:3002
      CONTENT_SERVICE_URL: http://content-service:3003
      LEARNING_SERVICE_URL: http://learning-service:3004
    depends_on:
      registration-service:
        condition: service_healthy
      login-service:
        condition: service_healthy
      content-service:
        condition: service_healthy
      learning-service:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-gateway:
        condition: service_healthy
